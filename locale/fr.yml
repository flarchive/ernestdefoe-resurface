      daily_label: Remontées par 24 heures
      daily_help: Nombre de remontées qu'un membre peut faire sur 24 heures, toutes discussions confondues. 0 pour aucune limite.
      log_days_label: Conserver l'historique pendant (jours)
      log_days_help: Les entrées plus anciennes sont supprimées. 0 les conserve toutes. Les limites journalières regardent toujours les dernières 24 heures.
    groups:
      label: Limites par groupe
      help: Laissez une case vide pour utiliser la valeur par défaut ci-dessus (en gris). Un membre de plusieurs groupes obtient la valeur la plus généreuse de chacune. Les groupes qui peuvent remonter n'importe quelle discussion n'ont aucune limite.
      group: Groupe
      cooldown: Délai (heures)
      daily: Remontées par 24 heures
    tags:
      label: Étiquettes où les membres peuvent remonter
      help: Ne cochez rien pour autoriser toutes les étiquettes. Les modérateurs peuvent remonter dans toutes les étiquettes.
    permissions:
      bump: Remonter ses propres discussions
      schedule: Planifier des remontées sur ses propres discussions
      bump_any: Remonter n'importe quelle discussion, planifier et voir l'historique (sans limites)
    log:
      title: Historique des remontées

  api:
